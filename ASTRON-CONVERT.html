<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRON CONVERT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f9ff;--bg2:#e3f3ff;--card:rgba(255,255,255,.75);--text:#0f2740;--muted:#58708a;--primary:#38bdf8;--primary2:#0ea5e9;--border:rgba(14,116,184,.15);--shadow:0 8px 30px rgba(14,116,184,.12);--ok:#16a34a;--bad:#dc2626}
[data-theme=dark]{--bg:#0b1220;--bg2:#101a2e;--card:rgba(24,36,58,.75);--text:#e6f0fb;--muted:#93a7c0;--border:rgba(125,180,255,.15);--shadow:0 8px 30px rgba(0,0,0,.4)}
[data-theme=blue]{--bg:#0a4a8f;--bg2:#0b61b8;--card:rgba(255,255,255,.14);--text:#fff;--muted:#cfe6ff;--border:rgba(255,255,255,.25);--shadow:0 8px 30px rgba(0,30,80,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--text);font:16px/1.6 Poppins,Cairo,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;transition:background .3s,color .3s}
html[lang=ar] body{font-family:Cairo,Poppins,sans-serif}
#app{flex:1;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:1.2rem;background:linear-gradient(90deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.brand svg{width:28px;height:28px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:999px;transition:.2s;font-size:.95rem}
nav a:hover,nav a.on{background:var(--primary);color:#05283f}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;width:100%;outline:none;transition:.2s}
select{width:auto;padding:6px 10px}
input:focus,textarea:focus,select:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(56,189,248,.3)}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:40px;width:70px}
option{color:#0f2740}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;font:inherit;font-weight:600;padding:9px 18px;border-radius:999px;color:#05283f;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:var(--shadow);transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.danger{background:var(--bad);color:#fff}
.menu{display:none}
main{width:100%;max-width:1100px;margin:0 auto;padding:24px 16px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow);transition:.25s}
.card:hover{transform:translateY(-2px)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hero{text-align:center;padding:56px 16px}
.hero h1{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 12px}
.hero p{color:var(--muted);max-width:620px;margin:0 auto 24px}
.badge{display:inline-block;padding:2px 12px;border-radius:999px;font-size:.8rem;background:var(--primary);color:#05283f}
.badge.ok{background:var(--ok);color:#fff}.badge.bad{background:var(--bad);color:#fff}
.form{max-width:420px;margin:30px auto;display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
label.row{display:flex;align-items:center;gap:8px}
.stat b{display:block;font-size:1.9rem}.stat span{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--border);white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;overflow-x:auto;padding-top:10px}
.bars div{flex:1;min-width:14px;border-radius:6px 6px 0 0;background:linear-gradient(var(--primary),var(--primary2));position:relative;transition:.3s}
.bars div:hover{filter:brightness(1.2)}
.bars small{position:absolute;bottom:-18px;inset-inline-start:0;font-size:.6rem;color:var(--muted);white-space:nowrap}
.bars.h{display:grid;height:auto;gap:6px}
.bars.h div{height:24px;min-width:4px;border-radius:0 8px 8px 0;display:flex;align-items:center;padding:0 8px;color:#05283f;font-size:.8rem;white-space:nowrap}
.bars.h:not(.x){}
.chart{margin-bottom:26px}
.banner{background:#f59e0b;color:#1f1300;text-align:center;padding:8px;font-weight:600}
footer{padding:20px;text-align:center;color:var(--muted);border-top:1px solid var(--border);font-size:.9rem}
.social{display:flex;gap:10px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary2);border-radius:50%;animation:s .8s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:fit-content;max-width:90%;padding:10px 20px;border-radius:14px;background:#0f2740;color:#fff;opacity:0;pointer-events:none;transition:.3s;z-index:50}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
.err-msg{color:var(--bad);min-height:1.2em;font-size:.9rem}
@media(max-width:820px){
 header{flex-wrap:wrap}.menu{display:inline-flex}
 nav{display:none;order:5;width:100%;flex-direction:column}nav.open{display:flex}
 .tools{margin-inline-start:auto}
}

.muted{color:var(--muted)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.inline input{flex:1;min-width:160px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{font:inherit;cursor:pointer;padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);transition:.2s}
.chip:hover{transform:translateY(-2px)}.chip.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#05283f;font-weight:600}
.drop{border:2px dashed var(--primary2);border-radius:20px;padding:40px 16px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{background:rgba(56,189,248,.15);transform:scale(1.01)}.drop .big{font-size:2.4rem;color:var(--primary2)}
.prev{width:100%;max-height:360px;border-radius:16px;background:#000}
.progress{height:16px;border-radius:999px;background:var(--border);overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .4s;border-radius:999px;background-size:200%;animation:flow 2s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.dot{display:inline-block;width:12px;height:12px;border:2px solid #05283f;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;margin-inline-end:8px;vertical-align:-1px}

</style>
</head>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
let API = window.ASTRON_API;
// If this page is served by the ASTRON backend (same origin), talk to it directly.
async function detectApi() {
  try { if (/^https?:$/.test(location.protocol)) { const d = await (await fetch('/api/health')).json(); if (d && d.ok === true) API = ''; } } catch {}
}
const S = { lang: localStorage.lang || 'ar', theme: localStorage.theme || null, user: null, site: {}, mode: sessionStorage.mode || 'admin', adminData: {} };
const t = k => (I18N[S.lang][k] ?? k);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const isAdmin = () => S.user && S.user.role === 'ADMIN';
const adminView = () => isAdmin() && S.mode === 'admin';

async function api(path, { method = 'GET', body } = {}) {
  let res;
  try {
    res = await fetch(API + path, { method, credentials: 'include', headers: { 'Content-Type': 'application/json', 'X-Lang': S.lang }, body: body ? JSON.stringify(body) : undefined });
  } catch { throw { message: t('net') }; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw { status: res.status, message: data.message?.[S.lang] || data.message || data.error || t('net') };
  return data;
}
function toast(msg, bad) { const e = $('#toast'); e.textContent = msg; e.className = 'show' + (bad ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => e.className = '', 3000); }
const fmtDate = d => new Date(d).toLocaleString(S.lang);
const fmtDur = ms => ms == null ? '—' : (ms / 1000).toFixed(1) + 's';

function applyLook() {
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  const mode = S.theme || (['light', 'dark', 'blue'].includes(S.site.theme?.mode) ? S.site.theme.mode : 'light');
  document.documentElement.dataset.theme = mode;
  const p = S.site.theme?.primary;
  if (p && /^#[0-9a-f]{6}$/i.test(p)) document.documentElement.style.setProperty('--primary', p);
  document.title = (S.site.site_name || 'ASTRON CONVERT');
}

const LOGO = '<svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs><circle cx="16" cy="16" r="14" fill="url(#g)"/><path d="M16 6l3 8h8l-6.5 5 2.5 8-7-5-7 5 2.5-8L5 14h8z" fill="#fff"/></svg>';

function layout(content) {
  const r = route();

    <a class="brand" href="#/">${LOGO}<span>${esc(S.site.site_name || 'ASTRON CONVERT')}</span></a>
    <button class="btn ghost menu" id="menu" aria-label="menu">☰</button>
    <nav id="nav">${links.map(([k, p]) => `<a href="#${p}" class="${r === p ? 'on' : ''}">${t(k)}</a>`).join('')}</nav>
    <div class="tools">
      <select id="langSel" aria-label="${t('lang')}">${[['ar', 'العربية'], ['en', 'English'], ['fr', 'Français']].map(([c, n]) => `<option value="${c}" ${c === S.lang ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <select id="themeSel" aria-label="${t('theme')}">${['light', 'dark', 'blue'].map(m => `<option value="${m}" ${document.documentElement.dataset.theme === m ? 'selected' : ''}>${t(m)}</option>`).join('')}</select>
      ${isAdmin() ? `<button class="btn ghost" id="modeBtn">${adminView() ? t('userMode') : t('backAdmin')}</button>` : ''}
      ${S.user ? `<button class="btn" id="logout">${t('logout')}</button>` : `<a class="btn ghost" href="#/login">${t('login')}</a><a class="btn" href="#/register">${t('register')}</a>`}
    </div></header>
    <main id="main">${content}</main>
    <footer><div class="social"><a class="btn ghost" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029VbEPv2q59PwbQFNJ4h2p">${t('wa')}</a><a class="btn ghost" target="_blank" rel="noopener" href="https://www.facebook.com/profile.php?id=61594747541201">${t('fb')}</a></div>
    <div><a href="#/privacy">${t('privacy')}</a> · <a href="#/terms">${t('terms')}</a></div><div>${t('rights')}</div>${API === '' ? '' : `<div><button class="chip" id="apiBtn" title="${esc(API)}">API</button></div>`}</footer>`;
  if ($('#apiBtn')) $('#apiBtn').onclick = () => {
    const v = prompt(t('apiPrompt'), localStorage.astronApi || API); if (v === null) return;
    const u = v.trim().replace(/\/+$/, '');
    if (!u) localStorage.removeItem('astronApi'); else if (/^https?:\/\/[^\s]+$/i.test(u)) localStorage.astronApi = u; else return toast(t('badUrl'), true);
    location.reload();
  };
  $('#menu').onclick = () => $('#nav').classList.toggle('open');
  $('#nav').onclick = () => $('#nav').classList.remove('open');
  $('#langSel').onchange = e => { S.lang = localStorage.lang = e.target.value; applyLook(); render(); };
  $('#themeSel').onchange = e => { S.theme = localStorage.theme = e.target.value; applyLook(); };
  if ($('#modeBtn')) $('#modeBtn').onclick = () => { S.mode = sessionStorage.mode = adminView() ? 'user' : 'admin'; location.hash = adminView() ? '#/admin' : '#/dashboard'; render(); };
  if ($('#logout')) $('#logout').onclick = async () => { await api('/api/auth/logout', { method: 'POST' }).catch(() => {}); S.user = null; S.mode = 'admin'; sessionStorage.mode = 'admin'; location.hash = '#/'; render(); };
}
const route = () => (location.hash.slice(1) || '/').split('?')[0];
const off = on => on === false ? ` <span class="badge bad">${t('svcOff')}</span>` : '';
const srcLabel = x => ({ facebook: 'Facebook', google: 'Google', kick: 'Kick', other: t('srcOther'), upload: t('uploadSrc') }[x] || x || '—');
const reasonText = e => e ? (I18N[S.lang]['err_' + e] || e) : '—';
const paras = k => t(k).map(p => `<p>${esc(p)}</p>`).join('');
const page = (title, body) => `<div class="card"><h2>${title}</h2>${body}</div>`;

/* ---------- pages ---------- */
const pages = {
  '/': () => `<section class="hero"><h1>${t('heroTitle')}</h1><p>${t('heroSub')}</p>
    ${S.user ? `<a class="btn" href="#/dashboard">${t('dashboard')}</a>` : `<a class="btn" href="#/register">${t('register')}</a> <a class="btn ghost" href="#/login">${t('login')}</a>`}</section>
    <div class="grid">
      <div class="card"><h3>${t('extractor')}${off(S.site.link_extractor_enabled)}</h3><p>${t('extractorD')}</p><a class="btn" href="#/extractor">${t('extractor')}</a></div>
      <div class="card"><h3>${t('converter')}${off(S.site.video_converter_enabled)}</h3><p>${t('converterD')}</p>
        <p><small>${t('max')}: ${esc(S.site.max_upload_mb)} MB · ${t('fmts')}: ${(S.site.output_formats || []).map(f => esc(f.toUpperCase())).join(', ')}</small></p><a class="btn" href="#/converter">${t('converter')}</a></div></div>`,
  '/about': () => page(t('about'), paras('aboutT')),
  '/privacy': () => page(t('privacy'), paras('privT')),
  '/terms': () => page(t('terms'), paras('termsT')),
  '/contact': () => page(t('contact'), `<p>${t('contactT')}</p><div class="social"><a class="btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029VbEPv2q59PwbQFNJ4h2p">${t('wa')}</a><a class="btn" target="_blank" rel="noopener" href="https://www.facebook.com/profile.php?id=61594747541201">${t('fb')}</a></div>`),
  '/settings': () => page(t('settings'), `<div class="grid"><label>${t('lang')}<select id="s_lang" style="width:100%">${[['ar', 'العربية'], ['en', 'English'], ['fr', 'Français']].map(([c, n]) => `<option value="${c}" ${c === S.lang ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label>${t('theme')}<select id="s_theme" style="width:100%">${['light', 'dark', 'blue'].map(m => `<option value="${m}" ${document.documentElement.dataset.theme === m ? 'selected' : ''}>${t(m)}</option>`).join('')}</select></label></div>`),
  '/login': () => authForm('login'),
  '/register': () => authForm('register'),
  '/dashboard': () => '<div class="spin"></div>',
  '/history': () => '<div class="spin"></div>',
  '/admin': () => '<div class="spin"></div>',
  '/extractor': () => '<div class="spin"></div>',
  '/converter': () => '<div class="spin"></div>',
};
function authForm(kind) {
  const reg = kind === 'register';
  return `<form class="card form" id="authForm"><h2>${t(kind)}</h2>
    <label>${t('username')}<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\\-]+"></label>
    <label>${t('password')}<input name="password" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required minlength="${reg ? 8 : 1}" maxlength="128"></label>
    ${reg ? `<label>${t('confirm')}<input name="confirmPassword" type="password" autocomplete="new-password" required></label>` : ''}
    <div class="err-msg" id="err"></div><button class="btn" type="submit">${t(kind)}</button>
    <small>${reg ? t('haveAcc') + ` <a href="#/login"><u>${t('login')}</u></a>` : t('noAcc') + ` <a href="#/register"><u>${t('register')}</u></a>`}</small></form>`;
}
function bindAuth(kind) {
  $('#authForm').onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true; $('#err').textContent = '';
    try {
      const d = Object.fromEntries(new FormData(e.target));
      const r = await api('/api/auth/' + kind, { method: 'POST', body: d });
      S.user = r.user; S.mode = 'admin'; sessionStorage.mode = 'admin';
      location.hash = r.user.role === 'ADMIN' ? '#/admin' : '#/dashboard'; render();
    } catch (er) { $('#err').textContent = er.message; b.disabled = false; }
  };
}
function histTable(items, admin) {
  if (!items.length) return `<p>${t('noOps')}</p>`;
  return `<div class="tbl"><table><tr>${admin ? `<th>${t('user')}</th>` : ''}<th>${t('type')}</th><th>${t('source')}</th><th>${t('format')}</th><th>${t('date')}</th><th>${t('duration')}</th><th>${t('status')}</th><th>${t('reason')}</th></tr>
  ${items.map(o => `<tr>${admin ? `<td>${esc(o.username)}</td>` : ''}<td>${t(o.type)}</td><td>${esc(srcLabel(o.source))}</td><td>${esc(o.output_format?.toUpperCase())}</td><td>${fmtDate(o.created_at)}</td><td>${fmtDur(o.duration_ms)}</td>
  <td><span class="badge ${o.status === 'success' ? 'ok' : 'bad'}">${t(o.status)}</span></td><td>${esc(reasonText(o.error))}</td></tr>`).join('')}</table></div>`;
}
async function loadDashboard(tok = S.tok) {
  const { items } = await api('/api/history?limit=200');
  if (tok !== S.tok) return; // ignore responses that arrive after the user left this page
  const ok = items.filter(i => i.status === 'success').length;
  $('#main').innerHTML = `<div class="card"><h2>${t('welcome')}, ${esc(S.user.username)}</h2><div class="grid"><div class="card stat"><b>${items.length}</b><span>${t('myOps')}</span></div><div class="card stat"><b>${ok}</b><span>${t('s_ok')}</span></div><div class="card stat"><b>${items.length - ok}</b><span>${t('s_bad')}</span></div></div></div>
  <div class="card" style="margin-top:16px"><h3>${t('recent')}</h3>${histTable(items.slice(0, 5))}</div>`;
}
async function loadHistory(tok = S.tok) {
  const { items } = await api('/api/history?limit=200');
  if (tok !== S.tok) return; // ignore responses that arrive after the user left this page
  $('#main').innerHTML = page(t('history'), `${histTable(items, isAdmin() && S.mode === 'admin')}${items.length && !(adminView()) ? `<p><button class="btn danger" id="clr">${t('clear')}</button></p>` : ''}`);
  if ($('#clr')) $('#clr').onclick = async () => { if (!confirm(t('confirmClear'))) return; await api('/api/history', { method: 'DELETE' }); toast(t('saved')); loadHistory(); };
}
const bars = (rows, lk, vertical = true) => {

  return vertical ? `<div class="bars">${rows.map(r => `<div style="height:${Math.max(4, r.n / max * 100)}%" title="${esc(r[lk])}: ${r.n}"><small>${r.n}</small></div>`).join('')}</div>`
    : `<div class="bars h">${rows.map(r => `<div style="width:${Math.max(8, r.n / max * 100)}%">${esc(String(r[lk]).toUpperCase())} · ${r.n}</div>`).join('')}</div>`;
};
async function loadAdmin(tok = S.tok) {
  if (!adminView()) { location.hash = '#/dashboard'; return; }

      <div><b>${t('fmts')}</b><div style="display:flex;gap:14px">${['mp4', 'm3u8', 'mpd'].map(f => `<label class="row"><input type="checkbox" class="fmt" value="${f}" ${s.output_formats.includes(f) ? 'checked' : ''}>${f.toUpperCase()}</label>`).join('')}</div></div>
      ${chk('f_maint', t('maintOn'), s.maintenance_mode)}
      ${['ar', 'en', 'fr'].map(l => `<label>${t('maintMsg')} (${l})<textarea id="m_${l}" maxlength="500">${esc(s.maintenance_message[l])}</textarea></label>`).join('')}
      <label>${t('primary')}<input id="f_color" type="color" value="${esc(s.theme.primary)}"></label>
      <label>${t('themeMode')}<select id="f_mode" style="width:100%">${['light', 'dark', 'blue'].map(m => `<option value="${m}" ${m === s.theme.mode ? 'selected' : ''}>${t(m)}</option>`).join('')}</select></label>
      <button class="btn" type="submit">${t('save')}</button></form>`;
    $('#setForm').onsubmit = async e => {
      e.preventDefault();
      try {
        await api('/api/admin/settings', { method: 'PUT', body: {
          site_name: $('#f_name').value, site_description: $('#f_desc').value, default_language: $('#f_lang').value,
          link_extractor_enabled: $('#f_ext').checked, video_converter_enabled: $('#f_conv').checked,
          max_upload_mb: parseInt($('#f_max').value), retention_minutes: parseInt($('#f_ret').value),
          output_formats: [...document.querySelectorAll('.fmt:checked')].map(x => x.value), maintenance_mode: $('#f_maint').checked,
          maintenance_message: { ar: $('#m_ar').value, en: $('#m_en').value, fr: $('#m_fr').value },
          theme: { primary: $('#f_color').value, mode: $('#f_mode').value } } });
        S.site = await api('/api/settings/public'); applyLook(); toast(t('saved')); render();
      } catch (er) { toast(er.message, true); }
    };
  } else if (tab === 'users') {
    const { items } = await api('/api/admin/users');
  if (tok !== S.tok) return; // ignore responses that arrive after the user left this page
    M.innerHTML = head + `<div class="card tbl"><table><tr><th>${t('username')}</th><th>${t('role')}</th><th>${t('created')}</th><th></th></tr>
    ${items.map(u => `<tr><td>${esc(u.username)}</td><td><span class="badge">${u.role}</span></td><td>${fmtDate(u.created_at)}</td><td>${u.role === 'USER' ? `<button class="btn danger" data-del="${u.id}">${t('del')}</button>` : ''}</td></tr>`).join('')}</table></div>`;
    M.onclick = async e => { const id = e.target.dataset?.del; if (!id || !confirm(t('confirmDel'))) return; try { await api('/api/admin/users/' + id, { method: 'DELETE' }); loadAdmin(); } catch (er) { toast(er.message, true); } };
  } else {
    const { items } = await api('/api/history?limit=200');
  if (tok !== S.tok) return; // ignore responses that arrive after the user left this page
    M.innerHTML = head + `<div class="card">${histTable(items, true)}</div>`;
  }
}

/* ---------- Link Extractor ---------- */
const EX = { source: 'other', url: '', fmt: null, busy: false, result: null, error: '' };
const onPage = p => route() === p && $('#main');
function loadExtractor() {
  const m = $('#main');
  if (S.site.link_extractor_enabled === false && !isAdmin()) { m.innerHTML = page(t('extractor'), `<p>${t('svcOff')}</p>`); return; }
  const fmts = S.site.output_formats || ['m3u8', 'mpd', 'mp4'];
  if (!EX.fmt || !fmts.includes(EX.fmt)) EX.fmt = fmts[0];
  const r = EX.result, safe = r && /^https?:\/\//i.test(r.url);
  m.innerHTML = `<div class="card"><h2>${t('extractor')}</h2><p class="muted">${t('extNote')}</p>
    <div class="chips" role="radiogroup">${['facebook', 'google', 'kick', 'other'].map(k => `<button type="button" class="chip ${EX.source === k ? 'on' : ''}" data-src="${k}">${srcLabel(k)}</button>`).join('')}</div>
    <label>${t('urlL')}<div class="inline"><input id="exUrl" type="url" dir="ltr" placeholder="https://..." value="${esc(EX.url)}" maxlength="2048">
      <button type="button" class="btn ghost" id="exPaste">${t('paste')}</button><button type="button" class="btn ghost" id="exClear">${t('clr')}</button></div></label>
    <label>${t('outFmt')}<select id="exFmt" style="width:100%">${fmts.map(f => `<option value="${f}" ${f === EX.fmt ? 'selected' : ''}>${f.toUpperCase()}</option>`).join('')}</select></label>
    <div class="err-msg" id="exErr">${esc(EX.error)}</div>
    <button class="btn" id="exGo" ${EX.busy ? 'disabled' : ''}>${EX.busy ? `<span class="dot"></span>${t('analyzing')}` : t('analyze')}</button></div>
    ${r ? `<div class="card" style="margin-top:16px"><h3>${t('resTitle')} <span class="badge ok">${t('success')}</span></h3>
      <label>${t('extUrl')}<input id="exOut" dir="ltr" readonly value="${esc(r.url)}"></label>
      <p>${t('srcName')}: <b>${esc(srcLabel(r.source))}</b> · ${t('format')}: <b>${esc(r.format.toUpperCase())}</b></p>
      <div class="inline"><button class="btn" id="exCopy">${t('copy')}</button>${r.downloadable && safe ? `<a class="btn ghost" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${t('dl')}</a>` : ''}</div></div>` : ''}`;
  m.querySelectorAll('[data-src]').forEach(b => b.onclick = () => { EX.source = b.dataset.src; EX.url = $('#exUrl').value; loadExtractor(); });
  $('#exUrl').oninput = e => { EX.url = e.target.value; };
  $('#exFmt').onchange = e => { EX.fmt = e.target.value; };
  $('#exClear').onclick = () => { EX.url = ''; EX.result = null; EX.error = ''; loadExtractor(); };
  $('#exPaste').onclick = async () => { try { EX.url = (await navigator.clipboard.readText()).trim(); loadExtractor(); } catch { toast(t('net'), true); } };
  if ($('#exCopy')) $('#exCopy').onclick = async () => { try { await navigator.clipboard.writeText(EX.result.url); } catch { $('#exOut').select(); document.execCommand('copy'); } toast(t('copied')); };
  $('#exGo').onclick = async () => {
    EX.url = $('#exUrl').value.trim(); EX.error = ''; EX.result = null;
    let ok = false; try { const u = new URL(EX.url); ok = /^https?:$/.test(u.protocol); } catch {}
    if (!ok) { EX.error = t('badUrl'); return loadExtractor(); }
    EX.busy = true; loadExtractor();
    try { EX.result = await api('/api/extractor/analyze', { method: 'POST', body: { url: EX.url, source: EX.source, format: EX.fmt } }); }
    catch (er) { EX.error = er.message; if (er.status === 401) { S.user = null; location.hash = '#/login'; } }
    EX.busy = false; if (onPage('/extractor')) loadExtractor();
  };
}

/* ---------- Video Converter (state-driven so language/theme changes and navigation never lose progress) ---------- */
const EXTS = ['.mp4', '.mov', '.mkv', '.webm', '.avi', '.m4v', '.ts', '.flv', '.wmv', '.3gp'];
const CV = { file: null, url: null, dur: null, fmt: null, phase: 'idle', pct: 0, job: null, error: '' };
const fmtSize = b => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const fmtTime = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const cvBusy = () => ['uploading', 'queued', 'running'].includes(CV.phase);
function cvReset() {
  if (CV.url) URL.revokeObjectURL(CV.url);
  Object.assign(CV, { file: null, url: null, dur: null, phase: 'idle', pct: 0, job: null, error: '' }); sessionStorage.removeItem('astronJob');
}
function cvPaint() {
  const m = onPage('/converter'); if (!m) return;
  if (S.site.video_converter_enabled === false && !isAdmin()) { m.innerHTML = page(t('converter'), `<p>${t('svcOff')}</p>`); return; }
  const fmts = S.site.output_formats || ['mp4', 'm3u8', 'mpd'];
  if (!CV.fmt || !fmts.includes(CV.fmt)) CV.fmt = fmts[0];
  const f = CV.file, name = f ? f.name : CV.job?.original_name || '', ph = CV.phase;
  let body;
  if (ph === 'idle' && !f) body = `<div class="drop" id="drop" tabindex="0"><div class="big">⬆</div><p>${t('drop')}</p><small>${EXTS.join(' ')} · ${t('max')}: ${esc(S.site.max_upload_mb)} MB</small>
      <input type="file" id="pick" accept="video/*,${EXTS.join(',')}" hidden></div>`;
  else if (ph === 'idle') body = `<video class="prev" src="${CV.url}" controls preload="metadata" playsinline></video>
      <p><b>${t('fName')}:</b> <span dir="ltr">${esc(f.name)}</span><br><b>${t('fSize')}:</b> ${fmtSize(f.size)}<br><b>${t('fDur')}:</b> <span id="cvDur">${CV.dur ? fmtTime(CV.dur) : '…'}</span></p>
      <label>${t('outFmt')}<select id="cvFmt" style="width:100%">${fmts.map(x => `<option value="${x}" ${x === CV.fmt ? 'selected' : ''}>${x.toUpperCase()}</option>`).join('')}</select></label>
      <div class="inline"><button class="btn" id="cvGo">${t('startConv')}</button><button class="btn ghost" id="cvRm">${t('rmFile')}</button></div>`;
  else if (cvBusy()) body = `<p><span dir="ltr">${esc(name)}</span></p><div class="progress"><div id="bar" style="width:${CV.pct}%"></div></div>
      <p><span id="cvSt"></span> <b id="pct">${CV.pct}%</b></p><button class="btn danger" id="cvCancel">${t('cancel')}</button>`;
  else if (ph === 'done') body = `<p><span class="badge ok">${t('st_done')}</span> <span dir="ltr">${esc(name)}</span></p>
      ${CV.job?.size_out ? `<p>${t('fSize')}: ${fmtSize(Number(CV.job.size_out))}</p>` : ''}${CV.job?.output_format !== 'mp4' ? `<p class="muted">${t('pkgNote')}</p>` : ''}<p class="muted">${t('keepNote')}</p>
      <div class="inline"><a class="btn" href="${API}/api/converter/jobs/${CV.job.id}/download">${t('dl')}</a><button class="btn ghost" id="cvAnother">${t('another')}</button></div>`;
  else body = `<p><span class="badge bad">${t('st_' + ph) || t('st_failed')}</span> ${esc(CV.error)}</p><button class="btn" id="cvAnother">${t('another')}</button>`;
  m.innerHTML = page(t('converter'), body);
  cvTick();
  const $$ = id => document.getElementById(id);
  if ($$('drop')) { const d = $$('drop'), pick = $$('pick');
    d.onclick = () => pick.click(); d.onkeydown = e => { if (e.key === 'Enter') pick.click(); };
    pick.onchange = () => pick.files[0] && cvChoose(pick.files[0]);
    d.ondragover = e => { e.preventDefault(); d.classList.add('over'); }; d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); e.dataTransfer.files[0] && cvChoose(e.dataTransfer.files[0]); }; }
  if ($$('cvFmt')) $$('cvFmt').onchange = e => { CV.fmt = e.target.value; };
  if ($$('cvRm')) $$('cvRm').onclick = () => { cvReset(); cvPaint(); };
  if ($$('cvGo')) $$('cvGo').onclick = cvUpload;
  if ($$('cvCancel')) $$('cvCancel').onclick = cvCancel;
  if ($$('cvAnother')) $$('cvAnother').onclick = async () => { const id = CV.job?.id; cvReset(); cvPaint(); if (id) api('/api/converter/jobs/' + id, { method: 'DELETE' }).catch(() => {}); };
  const v = m.querySelector('video'); if (v) v.onloadedmetadata = () => { CV.dur = v.duration; if ($$('cvDur')) $$('cvDur').textContent = fmtTime(v.duration); };
}
function cvTick() { // light update: progress bar + status text only (keeps the preview playing)
  const bar = document.getElementById('bar'); if (!bar) return;
  bar.style.width = CV.pct + '%'; document.getElementById('pct').textContent = CV.pct + '%';
  document.getElementById('cvSt').textContent = t(CV.phase === 'uploading' ? 'uploading' : 'st_' + CV.phase);
}
function cvChoose(file) {
  const ext = '.' + file.name.split('.').pop().toLowerCase();
  if (!EXTS.includes(ext)) return toast(t('badFile'), true);
  if (file.size > S.site.max_upload_mb * 1048576) return toast(`${t('tooBig')} (${S.site.max_upload_mb} MB)`, true);
  cvReset(); CV.file = file; CV.url = URL.createObjectURL(file); cvPaint();
}
function cvUpload() {
  const f = CV.file, x = new XMLHttpRequest(); S.xhr = x;
  x.open('POST', API + '/api/converter/jobs?' + new URLSearchParams({ format: CV.fmt, name: f.name }));
  x.withCredentials = true; x.setRequestHeader('Content-Type', 'application/octet-stream'); x.setRequestHeader('X-Lang', S.lang);
  x.upload.onprogress = e => { if (e.lengthComputable) { CV.pct = Math.round(e.loaded / e.total * 100); cvTick(); } };
  const bail = msg => { S.xhr = null; CV.phase = 'idle'; CV.pct = 0; toast(msg, true); cvPaint(); };
  x.onerror = () => bail(t('net')); x.onabort = () => { S.xhr = null; };
  x.onload = () => {
    S.xhr = null; let d = {}; try { d = JSON.parse(x.responseText); } catch {}
    if (x.status !== 202) return bail(d.message?.[S.lang] || d.message || t('net'));
    CV.job = d.job; sessionStorage.astronJob = d.job.id; CV.phase = d.job.status; CV.pct = 0; cvPaint(); cvPoll();
  };
  CV.phase = 'uploading'; CV.pct = 0; cvPaint(); x.send(f);
}
function cvPoll() {
  clearInterval(S.poll);
  S.poll = setInterval(async () => {
    try {
      const { job } = await api('/api/converter/jobs/' + CV.job.id); CV.job = job;
      if (['queued', 'running'].includes(job.status)) { CV.pct = job.progress; if (CV.phase !== job.status) { CV.phase = job.status; cvPaint(); } else cvTick(); return; }
      clearInterval(S.poll); CV.pct = 100; CV.phase = job.status === 'done' ? 'done' : job.status === 'cancelled' ? 'cancelled' : 'failed';
      CV.error = job.status === 'done' ? '' : reasonText(job.status === 'expired' ? 'EXPIRED' : job.error); cvPaint();
    } catch (er) { if (er.status === 404 || er.status === 401) { clearInterval(S.poll); cvReset(); cvPaint(); } }
  }, 1000);
}
async function cvCancel() {
  if (CV.phase === 'uploading' && S.xhr) { S.xhr.abort(); S.xhr = null; CV.phase = 'idle'; CV.pct = 0; return cvPaint(); }
  try { await api(`/api/converter/jobs/${CV.job.id}/cancel`, { method: 'POST' }); } catch (er) { toast(er.message, true); }
}
async function loadConverter() {
  if (!CV.job && !CV.file && sessionStorage.astronJob) { // resume a job that was running when the page was left/refreshed
    try { const { job } = await api('/api/converter/jobs/' + sessionStorage.astronJob);
      if (['queued', 'running', 'done'].includes(job.status)) { CV.job = job; CV.phase = job.status; CV.pct = job.progress; if (job.status !== 'done') cvPoll(); } else sessionStorage.removeItem('astronJob');
    } catch { sessionStorage.removeItem('astronJob'); }
  }
  cvPaint();
}
const loaders = { '/dashboard': loadDashboard, '/history': loadHistory, '/admin': loadAdmin, '/extractor': loadExtractor, '/converter': loadConverter };

async function render() {
  const r = route(), tok = S.tok = (S.tok || 0) + 1;
  let p = pages[r];
  if (['/dashboard', '/history', '/admin', '/extractor', '/converter'].includes(r) && !S.user) { location.hash = '#/login'; return; }
  if (['/login', '/register'].includes(r) && S.user) { location.hash = '#/dashboard'; return; }
  if (r === '/admin' && !adminView()) { location.hash = '#/dashboard'; return; }
  layout(p ? p() : `<div class="card">${t('nf')}</div>`);
  if (r === '/login' || r === '/register') bindAuth(r.slice(1));
  if (r === '/settings') {
    $('#s_lang').onchange = e => { S.lang = localStorage.lang = e.target.value; applyLook(); render(); };
    $('#s_theme').onchange = e => { S.theme = localStorage.theme = e.target.value; applyLook(); };
  }
  if (loaders[r]) try { await loaders[r](tok); } catch (er) {
    if (er.status === 401) { S.user = null; location.hash = '#/login'; render(); } else $('#main').innerHTML = `<div class="card err-msg">${esc(er.message)}</div>`;
  }
}

async function track() {
  let id = localStorage.visitorId;
  if (!id) id = localStorage.visitorId = crypto.randomUUID();
  api('/api/track', { method: 'POST', body: { visitorId: id } }).catch(() => {});
}
async function init() {
  // Arabic is the default for new visitors; the saved choice is used afterwards.
  if (!localStorage.lang) S.lang = 'ar';
  applyLook();
  $('#app').innerHTML = `<div class="spin"></div>`;
  await detectApi();
  try { S.site = await api('/api/settings/public'); } catch (e) { toast(e.message, true); }
  try { S.user = (await api('/api/auth/me')).user; } catch {}
  applyLook(); track(); render();
  window.addEventListener('hashchange', render);
}
init();
})();

</script>
